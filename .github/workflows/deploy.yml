name: Auto Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server update
        run: |
          curl -s -X POST http://102.37.152.29:3002/webhook \
            -H "x-webhook-secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --connect-timeout 10 \
            --max-time 15 || echo "Server update triggered (timeout ok)"
