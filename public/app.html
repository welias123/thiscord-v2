<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ThisCord</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app" id="app" style="display:none">

  <!-- ── Left Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <svg class="sidebar-logo" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="15" fill="url(#slg)"/>
        <path d="M9 16h14M16 9v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <defs><linearGradient id="slg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
          <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
        </linearGradient></defs>
      </svg>
      <span class="sidebar-title">ThisCord</span>
    </div>

    <!-- Text Channels -->
    <div class="sidebar-section">
      <div class="sidebar-label">Text-Channels</div>
    </div>
    <div id="channel-list"></div>

    <!-- Voice Channels -->
    <div class="sidebar-section" style="margin-top:8px">
      <div class="sidebar-label">Sprachkanäle</div>
    </div>
    <div id="voice-channel-list"></div>

    <!-- DMs -->
    <div class="sidebar-section" style="margin-top:8px">
      <div class="sidebar-label">Direktnachrichten</div>
    </div>
    <div id="dm-list"></div>

    <!-- User panel -->
    <div class="user-panel">
      <div class="my-avatar" id="my-avatar" onclick="openSettings()">?</div>
      <div style="flex:1;min-width:0;cursor:pointer" onclick="openSettings()">
        <div class="my-name" id="my-name">...</div>
        <div class="my-tag" id="my-tag">Einstellungen</div>
      </div>
      <button class="panel-btn" title="Freunde" onclick="openFriends()">👥</button>
      <button class="panel-btn" title="Einstellungen" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <!-- ── Main ── -->
  <div class="main">
    <div class="chat-header" id="chat-header" style="display:none">
      <span class="chat-header-icon" id="chat-header-icon">#</span>
      <span class="chat-header-name" id="chat-header-name"></span>
      <span class="chat-header-desc" id="chat-header-desc"></span>
    </div>

    <div class="welcome" id="welcome">
      <div class="welcome-icon">💬</div>
      <h2>Willkommen bei ThisCord!</h2>
      <p>Wähle einen Channel oder starte eine Unterhaltung.</p>
    </div>

    <div class="messages-area" id="messages-area" style="display:none"></div>
    <div class="typing-indicator" id="typing-indicator" style="display:none"></div>
    <div class="input-area" id="input-area" style="display:none">
      <div class="input-box">
        <textarea class="msg-input" id="msg-input" placeholder="Nachricht schreiben..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- ── Right Panel ── -->
  <div class="right-panel">
    <div class="right-panel-tabs">
      <button class="rp-tab active" id="rp-tab-online" onclick="switchRpTab('online')">Online</button>
      <button class="rp-tab" id="rp-tab-members" onclick="switchRpTab('members')">Alle</button>
    </div>
    <div class="rp-content" id="rp-content"></div>
  </div>
</div>

<!-- ── Settings Modal ── -->
<div class="modal-overlay" id="modal-settings" style="display:none" onclick="closeModalOutside(event,'modal-settings')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">⚙️ Einstellungen</span>
      <button class="modal-close" onclick="closeModal('modal-settings')">✕</button>
    </div>

    <div style="display:flex;gap:12px;align-items:center;margin-bottom:20px">
      <div class="my-avatar" id="settings-avatar" style="width:56px;height:56px;font-size:22px">?</div>
      <div>
        <div style="font-weight:700;font-size:16px" id="settings-name-disp"></div>
        <div style="font-size:12px;color:var(--muted)" id="settings-email-disp"></div>
      </div>
    </div>

    <div class="form-group">
      <label>Avatar-Farbe</label>
      <div class="color-picker" id="color-picker"></div>
    </div>

    <div class="form-group">
      <label>Benutzername</label>
      <input type="text" id="set-username" maxlength="32"/>
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea id="set-bio" placeholder="Erzähl was über dich…" maxlength="200"></textarea>
    </div>
    <div id="set-err" class="error-msg"></div>
    <div id="set-suc" class="success-msg"></div>
    <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>

    <div class="divider"></div>
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">Passwort ändern</div>
    <div class="form-group"><label>Aktuelles Passwort</label><input type="password" id="set-pw-cur" placeholder="••••••••"/></div>
    <div class="form-group"><label>Neues Passwort</label><input type="password" id="set-pw-new" placeholder="Mindestens 6 Zeichen"/></div>
    <div id="set-pw-err" class="error-msg"></div>
    <div id="set-pw-suc" class="success-msg"></div>
    <button class="btn btn-secondary" onclick="changePassword()">Passwort ändern</button>

    <div class="divider"></div>
    <button class="btn btn-danger" onclick="logout()">Abmelden</button>
  </div>
</div>

<!-- ── Friends Modal ── -->
<div class="modal-overlay" id="modal-friends" style="display:none" onclick="closeModalOutside(event,'modal-friends')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">👥 Freunde</span>
      <button class="modal-close" onclick="closeModal('modal-friends')">✕</button>
    </div>

    <div style="margin-bottom:8px;font-size:12px;color:var(--muted)">Benutzername eingeben (exakt)</div>
    <div class="add-friend-form">
      <input type="text" id="add-friend-input" placeholder="Benutzername…" maxlength="32"/>
      <button class="btn btn-primary" onclick="sendFriendRequest()">Hinzufügen</button>
    </div>
    <div id="friend-err" class="error-msg"></div>
    <div id="friend-suc" class="success-msg"></div>

    <div class="divider"></div>

    <div id="pending-section" style="display:none">
      <div class="pending-label">Ausstehende Anfragen</div>
      <div id="pending-list"></div>
      <div class="divider"></div>
    </div>

    <div class="pending-label">Freunde</div>
    <div id="friends-list"><div style="color:var(--muted);font-size:13px;padding:8px">Noch keine Freunde 😢</div></div>
  </div>
</div>

<!-- Voice UI overlay -->
<div id="voice-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1a1a2a;border-top:1px solid #2a2a45;padding:10px 20px;display:none;align-items:center;gap:12px;z-index:100">
  <div style="color:#22c55e;font-size:13px;font-weight:700">🔊 Verbunden: <span id="voice-room-name"></span></div>
  <div id="voice-members-bar" style="display:flex;gap:8px;flex:1"></div>
  <button onclick="leaveVoice()" style="background:#ef4444;border:none;border-radius:8px;color:#fff;padding:6px 14px;cursor:pointer;font-weight:700">Verlassen</button>
  <button id="mute-btn" onclick="toggleMute()" style="background:#2a2a45;border:none;border-radius:8px;color:#fff;padding:6px 14px;cursor:pointer;font-weight:700">🎤 Stummschalten</button>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
