<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ThisCord — Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" fill="url(#lg)"/>
        <path d="M12 20h16M20 12v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
        </linearGradient></defs>
      </svg>
      <span class="auth-logo-name">ThisCord</span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Anmelden</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrieren</button>
    </div>

    <div id="err" class="error-msg"></div>
    <div id="suc" class="success-msg"></div>

    <!-- Login -->
    <div id="form-login">
      <div class="form-group">
        <label>E-Mail oder Benutzername</label>
        <input type="text" id="login-login" placeholder="z.B. elias@example.com" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Anmelden</button>
    </div>

    <!-- Register -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" id="reg-username" placeholder="z.B. elias" maxlength="32" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label>E-Mail</label>
        <input type="email" id="reg-email" placeholder="deine@email.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input type="password" id="reg-password" placeholder="Mindestens 6 Zeichen" autocomplete="new-password"/>
      </div>
      <button class="btn btn-primary" onclick="doRegister()">Konto erstellen</button>
    </div>
  </div>
</div>

<script>
function switchTab(t) {
  document.getElementById('form-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    t==='login');
  document.getElementById('tab-register').classList.toggle('active', t==='register');
  hideMsg();
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('suc').style.display = 'none';
}
function showSuc(msg) {
  const el = document.getElementById('suc');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('err').style.display = 'none';
}
function hideMsg() {
  document.getElementById('err').style.display = 'none';
  document.getElementById('suc').style.display = 'none';
}

async function doLogin() {
  const login    = document.getElementById('login-login').value.trim();
  const password = document.getElementById('login-password').value;
  if (!login || !password) return showErr('Bitte alle Felder ausfüllen.');
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ login, password }) });
    const d = await r.json();
    if (!r.ok) return showErr(d.error || 'Fehler beim Anmelden.');
    localStorage.setItem('tc-token', d.token);
    localStorage.setItem('tc-user', JSON.stringify(d.user));
    location.href = '/app.html';
  } catch { showErr('Server nicht erreichbar.'); }
}

async function doRegister() {
  const username = document.getElementById('reg-username').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!username || !email || !password) return showErr('Bitte alle Felder ausfüllen.');
  try {
    const r = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username, email, password }) });
    const d = await r.json();
    if (!r.ok) return showErr(d.error || 'Fehler bei Registrierung.');
    localStorage.setItem('tc-token', d.token);
    localStorage.setItem('tc-user', JSON.stringify(d.user));
    location.href = '/app.html';
  } catch { showErr('Server nicht erreichbar.'); }
}

// enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = document.getElementById('form-login').style.display !== 'none';
  if (active) doLogin(); else doRegister();
});

// redirect if already logged in
if (localStorage.getItem('tc-token')) location.href = '/app.html';
</script>
</body>
</html>
